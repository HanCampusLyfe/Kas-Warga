<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KasWarga - Senantiasa Amanah</title>
    <!-- Menggunakan Tailwind CSS untuk styling cepat -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Menggunakan FontAwesome untuk Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts untuk tipografi yang elegan dan mudah dibaca -->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Open Sans', sans-serif;
            /* Mencegah scroll horizontal jika ada elemen yang meluber */
            overflow-x: hidden; 
        }
        
        /* Efek latar belakang gambar full screen dengan overlay gelap agar teks putih tetap terbaca */
        .hero-bg {
            background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.6)), url('https://images.unsplash.com/photo-1511895426328-dc8714191300?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
        }

        /* Glassmorphism: Efek tembus pandang nge-blur untuk kartu */
        .glass-card {
            background: rgba(20, 20, 20, 0.65);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Menyembunyikan scrollbar tapi tetap bisa di-scroll (untuk area kartu) */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="hero-bg text-white pb-20 md:pb-0 md:pr-20">
    <!-- NAVBAR ATAS (Logo & Menu Simple) -->
    <header class="flex justify-between items-center px-6 py-6 md:px-12 md:py-8 relative z-20">
        <div class="flex items-center gap-3">
            <!-- Logo Sederhana -->
            <div class="w-10 h-10 bg-white rounded-full flex items-center justify-center text-[#005AAA]">
                <i class="fa-solid fa-house-chimney text-xl"></i>
            </div>
            <div>
                <h1 class="text-2xl font-bold italic tracking-tight">KasWarga</h1>
                <p class="text-[10px] md:text-xs">Senantiasa Transparan & Amanah</p>
            </div>
        </div>
        
        <!-- Menu Kanan Atas -->
        <div class="flex items-center gap-6">
            <button class="text-2xl hover:text-gray-300 transition"><i class="fa-solid fa-magnifying-glass"></i></button>
            <button class="text-3xl hover:text-gray-300 transition"><i class="fa-solid fa-bars"></i></button>
        </div>
    </header>

    <!-- KONTEN UTAMA (Tengah Layar) -->
    <main class="px-6 md:px-16 lg:px-24 pt-10 md:pt-20 flex flex-col justify-center relative z-10 max-w-7xl mx-auto">
        
        <!-- Area Pencarian Tagihan (BCA Style Input) -->
        <div class="w-full md:w-3/4 lg:w-2/3 mb-10">
            <div class="relative">
                <!-- Input field bergaya garis bawah -->
                <input type="text" 
                       placeholder="Cari nama komplek atau perumahan..." 
                       class="w-full bg-transparent border-b-2 border-white pb-4 text-2xl md:text-4xl lg:text-5xl outline-none placeholder-gray-300 font-light focus:border-white transition-colors"
                       autocomplete="off">
                <!-- Tombol Cari Bulat -->
                <button class="absolute right-0 bottom-4 bg-[#005AAA] hover:bg-[#004a8b] w-10 h-10 md:w-12 md:h-12 rounded-full flex items-center justify-center transition shadow-lg">
                    <i class="fa-solid fa-magnifying-glass text-white text-lg md:text-xl"></i>
                </button>
            </div>
        </div>

        <!-- AREA KARTU INFO (Glassmorphism) -->
        <!-- Di HP bisa digeser ke samping (overflow-x-auto), di Desktop jadi Grid berdampingan -->
        <div class="flex md:grid md:grid-cols-2 gap-6 overflow-x-auto no-scrollbar pb-10 snap-x">
            
            <!-- Kartu 1: Pengumuman / Highlight -->
            <div class="glass-card rounded-2xl p-6 min-w-[280px] md:min-w-0 snap-center relative overflow-hidden group cursor-pointer">
                <!-- Efek gambar background di dalam kartu -->
                <div class="absolute inset-0 opacity-20 bg-[url('https://images.unsplash.com/photo-1449844908441-8829872d2607?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80')] bg-cover bg-center transition-transform duration-500 group-hover:scale-110"></div>
                
                <div class="relative z-10 h-32 md:h-40 flex flex-col justify-end">
                    <h3 class="text-xl md:text-2xl font-bold mb-1">#WargaKompak</h3>
                    <p class="text-sm md:text-base text-gray-200">Lingkungan Bersih, Hati Tenang.</p>
                </div>
            </div>

            <!-- Kartu 2: Info Kas / Data Realtime -->
            <div class="glass-card rounded-2xl p-6 min-w-[280px] md:min-w-0 snap-center flex flex-col justify-between">
                <div>
                    <a href="#" class="text-sm md:text-base border-b border-white pb-1 hover:text-gray-300 transition inline-block mb-4">
                        Status Laporan Kas
                    </a>
                    
                    <div class="flex justify-between items-center mb-6">
                        <button><i class="fa-solid fa-chevron-left"></i></button>
                        <div class="flex items-center gap-2 font-bold text-lg">
                            <i class="fa-solid fa-building-shield"></i> RT 03 / RW 08
                        </div>
                        <button><i class="fa-solid fa-chevron-right"></i></button>
                    </div>

                    <div class="space-y-4">
                        <div class="flex justify-between items-end border-b border-gray-500/50 pb-2">
                            <span class="text-gray-300 font-semibold">Kas Masuk</span>
                            <span class="text-xl md:text-2xl font-bold">17.690.000</span>
                        </div>
                        <div class="flex justify-between items-end">
                            <span class="text-gray-300 font-semibold">Tersalurkan</span>
                            <span class="text-xl md:text-2xl font-bold">14.975.000</span>
                        </div>
                    </div>
                </div>
                
                <p class="text-[10px] md:text-xs text-gray-400 mt-6">Data diperbarui secara real-time oleh Bendahara.</p>
            </div>

        </div>
    </main>

    <!-- NAVIGATION BAR (Biru BCA) -->
    <!-- Mode Mobile: Menempel di bawah (Bottom Bar) -->
    <!-- Mode Desktop: Menempel di samping kanan (Right Sidebar) -->
    <nav class="bg-[#005AAA] fixed z-50 
                bottom-0 left-0 w-full h-[80px] flex justify-around items-center px-2
                md:top-0 md:right-0 md:left-auto md:w-[90px] md:h-full md:flex-col md:justify-center md:py-10 md:gap-8">
        
        <!-- Tombol Login -->
        <a href="#" class="flex flex-col items-center justify-center w-16 md:w-full group">
            <div class="mb-1 text-2xl group-hover:-translate-y-1 transition-transform">
                <i class="fa-solid fa-right-to-bracket"></i>
            </div>
            <span class="text-[10px] md:text-xs">Login Admin</span>
        </a>

        <!-- Tombol Cara Bayar -->
        <a href="#" class="flex flex-col items-center justify-center w-16 md:w-full group">
            <div class="mb-1 text-2xl group-hover:-translate-y-1 transition-transform">
                <i class="fa-solid fa-file-invoice-dollar"></i>
            </div>
            <span class="text-[10px] md:text-xs">Cara Bayar</span>
        </a>

        <!-- Tombol Riwayat -->
        <a href="#" class="flex flex-col items-center justify-center w-16 md:w-full group">
            <div class="mb-1 text-2xl group-hover:-translate-y-1 transition-transform">
                <i class="fa-solid fa-clock-rotate-left"></i>
            </div>
            <span class="text-[10px] md:text-xs">Riwayat</span>
        </a>

        <!-- Tombol Bantuan -->
        <a href="#" class="flex flex-col items-center justify-center w-16 md:w-full group">
            <div class="mb-1 text-2xl group-hover:-translate-y-1 transition-transform">
                <i class="fa-regular fa-comment-dots"></i>
            </div>
            <span class="text-[10px] md:text-xs">Bantuan</span>
        </a>
    </nav>
<!-- Test -->
</body>
</html>
